[package]
name = "external-jet-lib-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"

[package.metadata.rbmt.lint]
# Bitcoin/Elements use different hash and hex majors, serde/wasm use different syn majors.
allowed_duplicates = ["bitcoin_hashes", "hex-conservative", "syn"]

[[bin]]
name = "external-lib-consumer"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
simplicityhl = { path = "..", features = ["external-jets"] }
