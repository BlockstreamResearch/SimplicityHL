[package]
name = "bitcoind-tests"
version = "0.1.0"
authors = ["sanket1729 <sanket1729@gmail.com>"]
edition = "2021"

[dependencies]
simplicityhl = { path = ".." }
elementsd = { version = "0.11.0" }
actual-rand = { package = "rand", version = "0.8.4" }
secp256k1 = { version = "0.29.0", features = ["rand-std"] }

[features]
unstable-bitcoin = ["simplicityhl/unstable-bitcoin"]

[[test]]
name = "bitcoin_spend_utxo"
required-features = ["unstable-bitcoin"]

# Local cross-repository experiment; this standalone package has its own workspace.
[patch.crates-io]
simplicity-lang = { path = "../../rust-simplicity" }
simplicity-sys = { path = "../../rust-simplicity/simplicity-sys" }
